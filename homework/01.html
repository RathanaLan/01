<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Record Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #4a90e2, #50e3c2);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        color: #fff;
      }
      h1 {
        margin-bottom: 20px;
      }
      form {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        flex-wrap: wrap;
        justify-content: center;
      }
      input {
        padding: 10px 15px;
        border-radius: 8px;
        border: none;
        font-size: 1rem;
        min-width: 200px;
      }
      button {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: #facc15;
        color: #000;
        font-weight: bold;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          background 0.3s ease;
      }
      button:hover {
        background: #fbbf24;
        transform: scale(1.05);
      }
      ul {
        list-style: none;
        width: 100%;
        max-width: 400px;
        padding: 0;
      }
      li {
        background: rgba(255, 255, 255, 0.2);
        padding: 12px 16px;
        margin-bottom: 10px;
        border-radius: 10px;
        font-size: 1.1rem;
        text-align: center;
        backdrop-filter: blur(4px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <h1>User Record Demo</h1>

    <form id="nameForm">
      <input type="text" id="nameInput" placeholder="Enter a name" required />
      <button type="submit">Add Name</button>
    </form>

    <h2>Stored Names</h2>
    <ul id="nameList"></ul>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

      // Replace with your project URL and anon key
      const supabaseUrl = "https://dgehlxhbggqxiznsryrv.supabase.co";
      const supabaseKey = "sb_publishable_0r0SqqjiXg8KGQVqQZM0TQ_KuCheFqj";
      const supabase = createClient(supabaseUrl, supabaseKey);

      const form = document.getElementById("nameForm");
      const input = document.getElementById("nameInput");
      const list = document.getElementById("nameList");

      // Insert new name into User_Record
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const { error } = await supabase
          .from("User_Record")
          .insert([{ User_Name: input.value }]);

        if (error) {
          alert("Error: " + error.message);
        } else {
          input.value = "";
          loadNames();
        }
      });

      // Load names from User_Record
      async function loadNames() {
        const { data, error } = await supabase
          .from("User_Record")
          .select("User_Name")
          .order("id", { ascending: true });

        list.innerHTML = "";
        if (error) {
          list.innerHTML = "<li>Error loading names</li>";
        } else {
          data.forEach((row) => {
            const li = document.createElement("li");
            li.textContent = row.User_Name;
            list.appendChild(li);
          });
        }
      }

      // Initial load
      loadNames();
    </script>
  </body>
</html>
