<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>404 - Page Not Found</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
        overflow: hidden;
      }

      /* Animated gradient background */
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(-45deg, #ff6ec4, #7873f5, #4ade80, #facc15);
        background-size: 400% 400%;
        animation: gradientBG 12s ease infinite;
        z-index: -2;
      }
      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Floating shapes */
      .shape {
        position: absolute;
        border-radius: 50%;
        opacity: 0.25;
        animation: float 20s infinite ease-in-out;
      }
      .shape:nth-child(1) {
        width: 120px;
        height: 120px;
        background: #ff6ec4;
        top: 10%;
        left: 15%;
        animation-delay: 0s;
      }
      .shape:nth-child(2) {
        width: 80px;
        height: 80px;
        background: #4ade80;
        top: 70%;
        left: 25%;
        animation-delay: 5s;
      }
      .shape:nth-child(3) {
        width: 150px;
        height: 150px;
        background: #facc15;
        top: 40%;
        left: 75%;
        animation-delay: 10s;
      }
      .shape:nth-child(4) {
        width: 100px;
        height: 100px;
        background: #7873f5;
        top: 80%;
        left: 60%;
        animation-delay: 15s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-40px) rotate(180deg);
        }
      }

      /* Particle canvas */
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      .container {
        text-align: center;
        padding: 40px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        max-width: 700px;
        z-index: 1;
      }

      h1 {
        font-size: 6rem;
        margin-bottom: 10px;
        color: #facc15;
      }

      h2 {
        font-weight: 400;
        margin-bottom: 20px;
      }

      p {
        font-size: 1.2rem;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      a {
        display: inline-block;
        padding: 12px 28px;
        background: #4ade80;
        color: #000;
        font-weight: bold;
        text-decoration: none;
        border-radius: 8px;
        transition:
          transform 0.2s ease,
          background 0.3s ease;
      }
      a:hover {
        background: #22c55e;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <!-- Floating shapes -->
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>

    <!-- Particle canvas -->
    <canvas id="particles"></canvas>

    <!-- Main content -->
    <div class="container">
      <h1>404</h1>
      <h2>Oops! Page Not Found</h2>
      <p>
        Looks like you wandered off the map.<br />
        Don’t worry — let’s get you back home.
      </p>
      <a href="/index.html">🏠 Go Home</a>
    </div>

    <script>
      // Continuous colorful water droplet trail
      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let droplets = [];

      // Spawn droplets at mouse position (when moving)
      document.addEventListener("mousemove", (e) => {
        spawnDroplets(e.clientX, e.clientY);
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      // Track last mouse position (default center of screen)
      let lastMouseX = canvas.width / 2;
      let lastMouseY = canvas.height / 2;

      function spawnDroplets(x, y) {
        for (let i = 0; i < 2; i++) {
          droplets.push({
            x: x,
            y: y,
            radius: Math.random() * 6 + 4,
            alpha: 1,
            hue: Math.random() * 360, // rainbow color
            ripple: 0,
            vx: (Math.random() - 0.5) * 1.2,
            vy: (Math.random() - 0.5) * 1.2,
          });
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Always spawn new droplets at last mouse position
        spawnDroplets(lastMouseX, lastMouseY);

        droplets.forEach((d, i) => {
          // Main droplet
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${d.hue}, 100%, 70%, ${d.alpha})`;
          ctx.fill();

          // Ripple ring
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.radius + d.ripple, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${d.hue}, 100%, 70%, ${d.alpha * 0.5})`;
          ctx.lineWidth = 2;
          ctx.stroke();

          d.x += d.vx;
          d.y += d.vy;
          d.alpha -= 0.008; // slow fade
          d.ripple += 0.3; // ripple expands outward

          if (d.alpha <= 0) droplets.splice(i, 1);
        });

        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    </script>
  </body>
</html>
