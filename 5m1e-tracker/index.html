<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5M1E Production & Change-Point Tracker</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom 5M1E Responsive Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- Microsoft Authentication Library (MSAL.js Browser v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.min.js"></script>
  <!-- React 18 & Babel for standalone browser runtime -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>

  <style>
/* ========================================================
   5M1E PRODUCTION QUALITY SUITE - RESPONSIVE & SMOOTH DESIGN SYSTEM
   ======================================================== */

:root {
  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  
  /* 5M1E Dimension Colors */
  --c-man: #38bdf8;
  --c-machine: #fb923c;
  --c-material: #34d399;
  --c-method: #a78bfa;
  --c-measurement: #f43f5e;
  --c-environment: #2dd4bf;
  
  /* Dark Theme Surfaces */
  --bg-dark: #0f172a;
  --surface-dark: #1e293b;
  --surface-border: #334155;
  --surface-border-subtle: rgba(255, 255, 255, 0.08);
  --text-muted: #94a3b8;
  
  /* Layout Dimensions */
  --nav-height: 64px;
  --mobile-bottom-nav-height: 62px;
  
  /* Smooth Transitions */
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --transition-fast: 0.18s var(--ease-smooth);
  --transition-normal: 0.25s var(--ease-smooth);
}

/* Global Reset & Base */
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-x: none;
}

body {
  font-family: var(--font-main);
  background-color: var(--bg-dark);
  color: #f8fafc;
  min-height: 100vh;
  margin: 0;
  padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Custom Smooth Industrial Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(15, 23, 42, 0.6);
}
::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #475569;
}

/* Smooth Animation Keyframes */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGlow {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* Typography & Utility Helpers */
.font-mono {
  font-family: var(--font-mono);
}

.text-purple {
  color: var(--c-method) !important;
}

.text-teal {
  color: var(--c-environment) !important;
}

/* Contained Layout Mode (For ultrawide 21:9 monitors) */
.app-container-contained {
  max-width: 1440px;
  margin-left: auto;
  margin-right: auto;
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.4);
}

/* ========================================================
   NAVIGATION & HEADER
   ======================================================== */

.navbar-custom {
  background: rgba(15, 23, 42, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--surface-border);
  min-height: var(--nav-height);
  z-index: 1030;
  transition: all var(--transition-normal);
}

.brand-badge {
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  padding: 0.25rem 0.5rem;
  border-radius: 6px;
  background: rgba(56, 189, 248, 0.15);
  color: var(--c-man);
  border: 1px solid rgba(56, 189, 248, 0.35);
  white-space: nowrap;
  font-weight: 700;
}

.navbar-brand-title {
  font-size: clamp(0.92rem, 2.2vw, 1.25rem);
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 0;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Mobile Nav Toggle Button */
.btn-nav-toggle {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--surface-border);
  color: #f8fafc;
  border-radius: 8px;
  padding: 0.4rem 0.65rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
  cursor: pointer;
  transition: all var(--transition-fast);
  min-width: 42px;
  min-height: 42px;
  touch-action: manipulation;
}

.btn-nav-toggle:hover, .btn-nav-toggle:focus {
  background: rgba(255, 255, 255, 0.12);
  color: #38bdf8;
  border-color: #38bdf8;
}

/* Mobile Menu Collapse Drawer */
.mobile-nav-panel {
  background: #111a2e;
  border-top: 1px solid var(--surface-border);
  border-bottom: 1px solid var(--surface-border);
  padding: 1rem;
  animation: slideDown 0.25s var(--ease-smooth);
}

.mobile-nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  font-size: 0.92rem;
  font-weight: 600;
  border: 1px solid transparent;
  color: #cbd5e1;
  background: rgba(255, 255, 255, 0.03);
  text-align: left;
  margin-bottom: 0.5rem;
  transition: all var(--transition-fast);
  min-height: 44px;
  touch-action: manipulation;
}

.mobile-nav-item:hover, .mobile-nav-item:active {
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
}

.mobile-nav-item.active {
  background: #2563eb;
  color: #ffffff;
  border-color: #3b82f6;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
}

/* Mobile Bottom Navigation Bar (Immediate thumb accessibility) */
.mobile-bottom-bar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(15, 23, 42, 0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--surface-border);
  z-index: 1020;
  height: calc(var(--mobile-bottom-nav-height) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.mobile-bottom-bar-inner {
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: var(--mobile-bottom-nav-height);
}

.bottom-nav-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: 600;
  gap: 3px;
  flex: 1;
  height: 100%;
  cursor: pointer;
  transition: color 0.15s ease, transform 0.15s ease;
  padding: 4px 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.bottom-nav-btn i {
  font-size: 1.18rem;
  line-height: 1;
}

.bottom-nav-btn.active {
  color: #38bdf8;
}

.bottom-nav-btn.active i {
  transform: scale(1.1);
}

.bottom-nav-btn-fab {
  position: relative;
  top: -10px;
  background: linear-gradient(135deg, #0284c7, #2563eb);
  color: #ffffff !important;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(37, 99, 235, 0.5);
  border: 2px solid var(--bg-dark);
  transition: transform 0.2s var(--ease-smooth);
}

.bottom-nav-btn-fab:active {
  transform: scale(0.95);
}

.bottom-nav-btn-fab i {
  font-size: 1.4rem;
}

/* User Avatar Pill */
.user-avatar-pill {
  background: #1e293b;
  border: 1px solid var(--surface-border);
  border-radius: 30px;
  padding: 0.25rem 0.75rem 0.25rem 0.35rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  min-height: 40px;
  transition: all var(--transition-fast);
}

.user-avatar-pill:hover {
  background: #283548;
  border-color: #475569;
}

.avatar-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0078d4, #002050);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 700;
  overflow: hidden;
  flex-shrink: 0;
}

.avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ========================================================
   QUICK FILTER PRESET CHIPS
   ======================================================== */

.filter-chips-container {
  display: flex;
  overflow-x: auto;
  white-space: nowrap;
  gap: 0.5rem;
  padding: 0.25rem 0 0.5rem 0;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.filter-chips-container::-webkit-scrollbar {
  display: none;
}

.filter-chip {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--surface-border);
  color: #cbd5e1;
  border-radius: 20px;
  padding: 0.35rem 0.85rem;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  flex-shrink: 0;
  user-select: none;
  touch-action: manipulation;
  min-height: 34px;
}

.filter-chip:hover {
  background: rgba(255, 255, 255, 0.09);
  color: #f8fafc;
  border-color: #475569;
}

.filter-chip.active {
  background: #2563eb;
  color: #ffffff;
  border-color: #3b82f6;
  box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
}

.filter-chip .chip-count {
  background: rgba(0, 0, 0, 0.35);
  padding: 0.1rem 0.45rem;
  border-radius: 10px;
  font-size: 0.7rem;
  font-family: var(--font-mono);
}

/* ========================================================
   KPI SUMMARY CARDS
   ======================================================== */

.kpi-card {
  background: var(--surface-dark);
  border: 1px solid var(--surface-border);
  border-radius: 12px;
  padding: 1.15rem;
  transition: transform var(--transition-normal), border-color var(--transition-normal), box-shadow var(--transition-normal);
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.kpi-card:hover {
  transform: translateY(-2px);
  border-color: #475569;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}

.kpi-title {
  font-size: clamp(0.72rem, 1.8vw, 0.82rem);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.kpi-value {
  font-size: clamp(1.4rem, 4vw, 1.85rem);
  font-weight: 700;
  font-family: var(--font-mono);
  line-height: 1.2;
}

.kpi-subtitle {
  font-size: clamp(0.7rem, 1.5vw, 0.78rem);
}

/* 5M1E Dimension Color Tags */
.badge-man { background-color: rgba(56, 189, 248, 0.15); color: var(--c-man); border: 1px solid rgba(56, 189, 248, 0.4); }
.badge-machine { background-color: rgba(251, 146, 60, 0.15); color: var(--c-machine); border: 1px solid rgba(251, 146, 60, 0.4); }
.badge-material { background-color: rgba(52, 211, 153, 0.15); color: var(--c-material); border: 1px solid rgba(52, 211, 153, 0.4); }
.badge-method { background-color: rgba(167, 139, 250, 0.15); color: var(--c-method); border: 1px solid rgba(167, 139, 250, 0.4); }
.badge-measurement { background-color: rgba(244, 63, 94, 0.15); color: var(--c-measurement); border: 1px solid rgba(244, 63, 94, 0.4); }
.badge-environment { background-color: rgba(45, 212, 191, 0.15); color: var(--c-environment); border: 1px solid rgba(45, 212, 191, 0.4); }

/* ========================================================
   SURFACE CARDS, TABLES & MOBILE CARDS
   ======================================================== */

.surface-card {
  background: var(--surface-dark);
  border: 1px solid var(--surface-border);
  border-radius: 14px;
  overflow: hidden;
  animation: fadeIn 0.3s var(--ease-smooth);
}

/* Custom Responsive Table */
.table-responsive {
  -webkit-overflow-scrolling: touch;
  max-height: 70vh;
}

.table-custom {
  --bs-table-bg: transparent;
  --bs-table-color: #e2e8f0;
  --bs-table-border-color: var(--surface-border);
}

.table-custom th {
  background-color: rgba(15, 23, 42, 0.85);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  padding: 0.85rem 1rem;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 5;
  backdrop-filter: blur(8px);
}

.table-custom td {
  padding: 0.95rem 1rem;
  vertical-align: middle;
  transition: background-color var(--transition-fast);
}

.table-row-hover:hover td {
  background-color: rgba(255, 255, 255, 0.04);
}

/* Mobile Record Card View */
.mobile-record-card {
  background: #151f32;
  border: 1px solid var(--surface-border);
  border-radius: 12px;
  padding: 1rem;
  margin-bottom: 0.85rem;
  transition: transform var(--transition-fast), border-color var(--transition-fast);
  animation: fadeIn 0.25s var(--ease-smooth);
}

.mobile-record-card:active {
  transform: scale(0.99);
}

.mobile-record-card.border-critical {
  border-left: 4px solid #f43f5e;
}

.mobile-record-card.border-warning {
  border-left: 4px solid #fb923c;
}

.mobile-record-card.border-normal {
  border-left: 4px solid #38bdf8;
}

.mobile-record-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.65rem;
  gap: 0.5rem;
}

.mobile-record-body {
  font-size: 0.9rem;
  color: #e2e8f0;
  margin-bottom: 0.75rem;
  line-height: 1.4;
}

.mobile-record-meta {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.5rem;
  font-size: 0.78rem;
  color: var(--text-muted);
  background: rgba(0, 0, 0, 0.25);
  padding: 0.65rem;
  border-radius: 8px;
  margin-bottom: 0.75rem;
}

.mobile-record-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  padding-top: 0.65rem;
}

/* Compact / High-Density Control Room Mode */
.density-compact .table-custom th {
  padding: 0.5rem 0.65rem;
  font-size: 0.7rem;
}

.density-compact .table-custom td {
  padding: 0.5rem 0.65rem;
  font-size: 0.82rem;
}

.density-compact .kpi-card {
  padding: 0.75rem 0.9rem;
}

.density-compact .kpi-value {
  font-size: 1.35rem;
}

.density-compact .mobile-record-card {
  padding: 0.65rem 0.85rem;
  margin-bottom: 0.5rem;
}

.density-compact .mobile-record-meta {
  padding: 0.4rem;
  margin-bottom: 0.4rem;
  font-size: 0.72rem;
}

/* ========================================================
   5M1E STEPPER & FORM CONTROLS
   ======================================================== */

.dimension-stepper-container {
  display: flex;
  overflow-x: auto;
  white-space: nowrap;
  gap: 0.5rem;
  padding-bottom: 0.5rem;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.dimension-stepper-container::-webkit-scrollbar {
  display: none;
}

.dimension-tab-btn {
  border-radius: 8px !important;
  font-weight: 600;
  font-size: 0.88rem;
  padding: 0.65rem 1rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  border: 1px solid transparent;
  color: var(--text-muted);
  transition: all var(--transition-fast);
  background: rgba(255, 255, 255, 0.03);
  flex-shrink: 0;
  min-height: 42px;
  touch-action: manipulation;
}

.dimension-tab-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
}

.dimension-tab-btn.active {
  background: #2563eb !important;
  color: #fff !important;
  border-color: #3b82f6 !important;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
}

.form-control, .form-select {
  background-color: #0b0f19;
  border: 1px solid #334155;
  color: #f8fafc;
  min-height: 42px;
  font-size: 0.92rem;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.form-control:focus, .form-select:focus {
  background-color: #0f172a;
  border-color: #38bdf8;
  color: #fff;
  box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.2);
}

.form-control::placeholder {
  color: #64748b;
}

/* ========================================================
   ISHIKAWA (FISHBONE) DIAGRAM
   ======================================================== */

.fishbone-wrapper {
  background: #0b0f19;
  border: 1px solid var(--surface-border);
  border-radius: 12px;
  padding: 1.25rem;
  overflow-x: auto;
  position: relative;
  -webkit-overflow-scrolling: touch;
}

.fishbone-scroll-hint {
  display: none;
  font-size: 0.75rem;
  color: #38bdf8;
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.25);
  border-radius: 6px;
  padding: 0.4rem 0.75rem;
  margin-bottom: 0.75rem;
}

.fishbone-svg {
  width: 100%;
  min-width: 840px;
  height: auto;
  aspect-ratio: 1000 / 520;
}

.fishbone-spine {
  stroke: #475569;
  stroke-width: 3;
}

.fishbone-card {
  rx: 8;
  ry: 8;
  filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4));
}

.fishbone-breakdown-card {
  background: #111827;
  border: 1px solid var(--surface-border);
  border-radius: 10px;
  padding: 0.85rem;
  height: 100%;
  transition: transform var(--transition-fast);
}

.fishbone-breakdown-card:hover {
  transform: translateY(-2px);
}

.fishbone-breakdown-card h6 {
  font-size: 0.85rem;
  margin-bottom: 0.5rem;
  font-weight: 700;
}

.fishbone-param-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  padding: 0.25rem 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.fishbone-param-row:last-child {
  border-bottom: none;
}

/* ========================================================
   MODALS & DEEP INSPECTION DRAWER
   ======================================================== */

.modal-content {
  background-color: #1e293b;
  border: 1px solid var(--surface-border);
  color: #f8fafc;
  border-radius: 14px;
  animation: fadeIn 0.25s var(--ease-smooth);
}

.inspection-modal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 0.85rem;
}

.dimension-detail-card {
  background: #0f172a;
  border: 1px solid var(--surface-border);
  border-radius: 10px;
  padding: 0.9rem;
  height: 100%;
}

.dimension-detail-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  padding-bottom: 0.5rem;
  margin-bottom: 0.65rem;
}

.param-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.82rem;
  padding: 0.3rem 0;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
}

.param-item:last-child {
  border-bottom: none;
}

/* Auth Provider Tabs */
.auth-tabs-scroll {
  display: flex;
  overflow-x: auto;
  white-space: nowrap;
  gap: 0.25rem;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}

.auth-tabs-scroll::-webkit-scrollbar {
  display: none;
}

.auth-tab-btn {
  padding: 0.65rem 0.95rem;
  font-weight: 600;
  font-size: 0.85rem;
  border: none;
  background: transparent;
  color: #94a3b8;
  border-bottom: 2px solid transparent;
  transition: all var(--transition-fast);
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
  min-height: 42px;
  touch-action: manipulation;
}

.auth-tab-btn:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.04);
}

        setActiveFishboneRecord(newRecord);
        setActiveTab("dashboard");

        // Persist into Supabase database 'production_records' table
        const client = getSupabase();
        if (client) {
          client.from('production_records').insert([{
            id: newRecord.id,
            timestamp: newRecord.timestamp,
            line: newRecord.line,
            shift: newRecord.shift,
            work_order: newRecord.workOrder,
            part_number: newRecord.partNumber,
            event_type: newRecord.eventType,
            severity: newRecord.severity,
            primary_dimension: newRecord.primaryDimension,
            summary: newRecord.summary,
            recorded_by: newRecord.recordedBy,
            recorded_by_name: newRecord.recordedByName,
            auth_provider: newRecord.authProvider,
            auth_method: newRecord.authMethod,
            m365_auth: newRecord.m365Auth,
            man_data: newRecord.man,
            machine_data: newRecord.machine,
            material_data: newRecord.material,
            method_data: newRecord.method,
            measurement_data: newRecord.measurement,
            environment_data: newRecord.environment
          }]).then(({ error }) => {
            if (error) console.warn("Supabase insert error:", error);
            else console.log("Record synced to Supabase database successfully!");
          });
        }
      };

      const exportToCSV = () => {
        const headers = [
          "ID", "Timestamp", "Line", "Shift", "WorkOrder", "PartNumber", "EventType", "Severity", 
          "PrimaryDimension", "Summary", "Operator", "RecordedBy_M365", "StationId", "LotNumber", "SOP", "Measured", "InSpec"
        ];
        const rows = records.map(r => [
          r.id,
          r.timestamp,
          r.line,
          r.shift,
          r.workOrder,
          r.partNumber,
          r.eventType,
          r.severity,
          r.primaryDimension,
          `"${r.summary.replace(/"/g, '""')}"`,
          `"${r.man.operator}"`,
          r.recordedBy || "N/A",
          r.machine.stationId,
          r.material.lotNumber,
          r.method.sopNumber,
          r.measurement.measured,
          r.measurement.inSpec
        ]);

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `5M1E_Production_Report_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Flexibility Feature: Export Full System Backup to JSON
      const exportToJSON = () => {
        const payload = {
          app: "5M1E Production Tracker",
          version: "2.1-flexible",
          exportDate: new Date().toISOString(),
          lines: linesList,
          shifts: shiftsList,
          recordsCount: records.length,
          records: records
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
        const downloadAnchor = document.createElement("a");
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `5M1E_FullBackup_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      // Flexibility Feature: Import Records from JSON Backup
      const handleImportJSON = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            let importedRecords = [];
            if (parsed.records && Array.isArray(parsed.records)) {
              importedRecords = parsed.records;
              if (parsed.lines && Array.isArray(parsed.lines)) setLinesList(parsed.lines);
              if (parsed.shifts && Array.isArray(parsed.shifts)) setShiftsList(parsed.shifts);
            } else if (Array.isArray(parsed)) {
              importedRecords = parsed;
            } else {
              alert("Unrecognized JSON format. Expected { records: [...] } or array of records.");
              return;
            }

            const existingIds = new Set(records.map(r => r.id));
            const newToAdd = importedRecords.filter(r => !existingIds.has(r.id));
            const combined = [...importedRecords.filter(r => existingIds.has(r.id)), ...newToAdd, ...records.filter(r => !new Set(importedRecords.map(x=>x.id)).has(r.id))];
            setRecords(combined);
            alert(`Import complete! ${importedRecords.length} records processed (${newToAdd.length} new records added).`);
          } catch (err) {
            alert("Error parsing JSON file: " + err.message);
          }
        };
        reader.readAsText(file);
      };

      // -------------------------------------------------------------
      // Record Editing & Deletion Handlers
      // -------------------------------------------------------------
      const handleStartEdit = (record) => {
        if (!record) return;
        setEditingRecordId(record.id);
        setFormData({
          line: record.line || (linesList[0] ? linesList[0].id : "LINE-01"),
          shift: record.shift || (shiftsList[0] ? shiftsList[0].id : "SHIFT-A"),
          workOrder: record.workOrder || "",
          partNumber: record.partNumber || "",
          eventType: record.eventType || "Change Point",
          severity: record.severity || "Warning",
          primaryDimension: record.primaryDimension || "Man",
          summary: record.summary || "",
          operator: record.man ? (record.man.operator || "") : "",
          skillLevel: record.man ? (record.man.skillLevel || "Tier 3") : "Tier 3",
          certified: record.man ? !!record.man.certified : true,
          manNotes: record.man ? (record.man.notes || "") : "",
          stationId: record.machine ? (record.machine.stationId || "") : "",
          machineStatus: record.machine ? (record.machine.status || "Running") : "Running",
          temperature: record.machine ? (record.machine.temperature ?? 24.0) : 24.0,

          supplier: record.material ? (record.material.supplier || "") : "",
          coaVerified: record.material ? !!record.material.coaVerified : true,
          materialNotes: record.material ? (record.material.notes || "") : "",
          sopNumber: record.method ? (record.method.sopNumber || "") : "",
          recipeId: record.method ? (record.method.recipeId || "") : "",
          stdCycleTime: record.method ? (record.method.stdCycleTime ?? 30) : 30,
          actCycleTime: record.method ? (record.method.actCycleTime ?? 30) : 30,
          methodNotes: record.method ? (record.method.notes || "") : "",
          toolId: record.measurement ? (record.measurement.toolId || "") : "",
          calibrationDue: record.measurement ? (record.measurement.calibrationDue || "") : "",
          feature: record.measurement ? (record.measurement.feature || "") : "",
          nominal: record.measurement ? (record.measurement.nominal ?? 10.0) : 10.0,
          lsl: record.measurement ? (record.measurement.lsl ?? 9.8) : 9.8,
          usl: record.measurement ? (record.measurement.usl ?? 10.2) : 10.2,
          measured: record.measurement ? (record.measurement.measured ?? 10.0) : 10.0,
          envTemp: record.environment ? (record.environment.temp ?? 22.5) : 22.5,
          envHumidity: record.environment ? (record.environment.humidity ?? 50) : 50,
          esdGrounding: record.environment ? (record.environment.esdGrounding || "Pass") : "Pass",
          cleanroomClass: record.environment ? (record.environment.cleanroomClass || "ISO 7") : "ISO 7"

        setInspectingRecord(null);
        setActiveTab("new-entry");
      };

      const handleDeleteRecord = (id) => {
        if (!confirm(`Are you sure you want to permanently delete record ${id}?`)) return;
        const updated = records.filter(r => r.id !== id);
        setRecords(updated);
        if (activeFishboneRecord && activeFishboneRecord.id === id) {

              summary: `${r.summary} [RESOLVED]`,
              countermeasure: noteWithSigner

          return r;

        setRecords(updated);
        setInspectingRecord(prev => ({
          ...prev,
          severity: prev.severity === 'Critical' ? 'Normal' : prev.severity,
          eventType: prev.eventType === 'Abnormality' ? 'Resolved' : prev.eventType,

      const getDimensionBadgeClass = (dim) => {

      const getSeverityBadge = (sev) => {
        if (sev === "Critical") return <span className="badge bg-danger text-white"><i className="bi bi-exclamation-triangle-fill me-1"></i>Critical</span>;
        if (sev === "Warning") return <span className="badge bg-warning text-dark"><i className="bi bi-exclamation-circle-fill me-1"></i>Warning</span>;
        return <span className="badge bg-success text-white"><i className="bi bi-check-circle-fill me-1"></i>Normal</span>;
      };

      // Filtered & Sorted Records with Quick Filter Chips & Dynamic Multi-column Sorting
      const filteredRecords = records.filter(r => {
        // 1. Quick Filter Preset Chips
        if (quickFilter === "CRITICAL" && r.severity !== "Critical") return false;
        if (quickFilter === "WARNING" && r.severity !== "Warning") return false;

        if (quickFilter === "MY_LOGS") {

          const myEmail = (currentUser.email || "").toLowerCase();
          const myName = (currentUser.name || "").toLowerCase();
          const recBy = (r.recordedBy || "").toLowerCase();

        // 2. Dropdown Filters
        if (selectedLine !== "ALL" && r.line !== selectedLine) return false;
        if (selectedShift !== "ALL" && r.shift !== selectedShift) return false;
        if (selectedDimension !== "ALL" && r.primaryDimension.toUpperCase() !== selectedDimension) return false;
        if (searchQuery.trim() !== "") {
          const q = searchQuery.toLowerCase();
          const match =
            (r.id && r.id.toLowerCase().includes(q)) ||
            (r.workOrder && r.workOrder.toLowerCase().includes(q)) ||
            (r.partNumber && r.partNumber.toLowerCase().includes(q)) ||
            (r.summary && r.summary.toLowerCase().includes(q)) ||
            (r.man && r.man.operator && r.man.operator.toLowerCase().includes(q)) ||
            (r.machine && r.machine.stationId && r.machine.stationId.toLowerCase().includes(q)) ||
            (r.recordedBy && r.recordedBy.toLowerCase().includes(q)) ||
            (r.material && r.material.lotNumber && r.material.lotNumber.toLowerCase().includes(q));
          if (!match) return false;
        }
        return true;
      }).sort((a, b) => {
        if (sortBy === "newest") {
          return new Date(b.timestamp || 0) - new Date(a.timestamp || 0);
        } else if (sortBy === "oldest") {
          return new Date(a.timestamp || 0) - new Date(b.timestamp || 0);
        } else if (sortBy === "severity") {
          const weight = { "Critical": 3, "Warning": 2, "Normal": 1, "Resolved": 0 };
          return (weight[b.severity] || 0) - (weight[a.severity] || 0);
        } else if (sortBy === "line") {
          return (a.line || "").localeCompare(b.line || "");
        } else if (sortBy === "workOrder") {
          return (a.workOrder || "").localeCompare(b.workOrder || "");
        }
        return 0;
      });

      const totalLogs = records.length;
      const changePoints = records.filter(r => r.eventType === "Change Point").length;
      const abnormalities = records.filter(r => r.eventType === "Abnormality").length;
      const criticals = records.filter(r => r.severity === "Critical").length;
      const outOfSpec = records.filter(r => !r.measurement.inSpec).length;

      return (
        <div className={`${density === "compact" ? "density-compact" : ""} ${layoutWidth === "contained" ? "app-container-contained" : ""}`}>

                <i className="bi bi-graph-up"></i>
                <span>Analytics</span>
              </button>

              <button 
                className={`bottom-nav-btn ${showLoginModal ? 'active' : ''}`}
                onClick={() => setShowLoginModal(true)}
              >
                <i className={`bi ${currentUser ? 'bi-person-circle text-info' : 'bi-shield-lock'}`}></i>
                <span>{currentUser ? 'Profile' : 'Auth'}</span>
              </button>
            </div>
          </div>

        </div>
      );
    }

    function RadarChartComponent({ records }) {
      const canvasRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        const counts = {
          Man: 0,
          Machine: 0,
          Material: 0,
          Method: 0,
          Measurement: 0,
          Environment: 0
        };

        records.forEach(r => {
          const dim = r.primaryDimension;
          if (counts[dim] !== undefined) counts[dim]++;
        });

        const ctx = canvasRef.current.getContext('2d');
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        chartInstance.current = new Chart(ctx, {
          type: 'radar',
          data: {
            labels: ['Man', 'Machine', 'Material', 'Method', 'Measurement', 'Environment'],
            datasets: [{
              label: 'Events & Change Points Recorded',
              data: [
                counts.Man,
                counts.Machine,
                counts.Material,
                counts.Method,
                counts.Measurement,
                counts.Environment
              ],
              backgroundColor: 'rgba(56, 189, 248, 0.25)',
              borderColor: '#38bdf8',
              borderWidth: 2,
              pointBackgroundColor: '#38bdf8',
              pointBorderColor: '#fff',
              pointHoverBackgroundColor: '#fff',
              pointHoverBorderColor: '#38bdf8'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              r: {
                angleLines: { color: '#334155' },
                grid: { color: '#1e293b' },
                pointLabels: {
                  color: '#f8fafc',
                  font: { size: 12, weight: 'bold' }
                },
                ticks: {
                  color: '#94a3b8',
                  backdropColor: 'transparent',
                  stepSize: 1
                }
              }
            },
            plugins: {
              legend: {
                labels: { color: '#f8fafc' }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, [records]);

      return (
        <div style={{ height: '340px', position: 'relative' }}>
          <canvas ref={canvasRef}></canvas>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
