<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5M1E Production & Change-Point Tracker</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- Microsoft Authentication Library (MSAL.js Browser v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
  <!-- React 18 & Babel for standalone browser runtime -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>

  <style>
    :root {
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --c-man: #38bdf8;
      --c-machine: #fb923c;
      --c-material: #34d399;
      --c-method: #a78bfa;
      --c-measurement: #f43f5e;
      --c-environment: #2dd4bf;
      
      --bg-dark: #0f172a;
      --surface-dark: #1e293b;
      --surface-border: #334155;
      --text-muted: #94a3b8;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-dark);
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
      padding-bottom: 2rem;
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    /* Header & Navigation */
    .navbar-custom {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
    }

    .brand-badge {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--c-man);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Microsoft 365 Branding */
    .btn-m365 {
      background-color: #2f2f2f;
      color: #ffffff;
      border: 1px solid #4a4a4a;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 600;
      padding: 0.6rem 1.25rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .btn-m365:hover {
      background-color: #3d3d3d;
      border-color: #00a4ef;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 164, 239, 0.3);
    }

    .user-avatar-pill {
      background: #1e293b;
      border: 1px solid var(--surface-border);
      border-radius: 30px;
      padding: 0.25rem 0.75rem 0.25rem 0.35rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .avatar-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0078d4, #002050);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      overflow: hidden;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* KPI Summary Cards */
    .kpi-card {
      background: var(--surface-dark);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 1.25rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .kpi-card:hover {
      transform: translateY(-2px);
      border-color: #475569;
    }

    .kpi-value {
      font-size: 1.85rem;
      font-weight: 700;
      font-family: var(--font-mono);
      line-height: 1.2;
    }

    /* 5M1E Dimension Color Tags */
    .badge-man { background-color: rgba(56, 189, 248, 0.15); color: var(--c-man); border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-machine { background-color: rgba(251, 146, 60, 0.15); color: var(--c-machine); border: 1px solid rgba(251, 146, 60, 0.4); }
    .badge-material { background-color: rgba(52, 211, 153, 0.15); color: var(--c-material); border: 1px solid rgba(52, 211, 153, 0.4); }
    .badge-method { background-color: rgba(167, 139, 250, 0.15); color: var(--c-method); border: 1px solid rgba(167, 139, 250, 0.4); }
    .badge-measurement { background-color: rgba(244, 63, 94, 0.15); color: var(--c-measurement); border: 1px solid rgba(244, 63, 94, 0.4); }
    .badge-environment { background-color: rgba(45, 212, 191, 0.15); color: var(--c-environment); border: 1px solid rgba(45, 212, 191, 0.4); }

    /* Surface Card */
    .surface-card {
      background: var(--surface-dark);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      overflow: hidden;
    }

    .dimension-tab-btn {
      border-radius: 8px !important;
      font-weight: 600;
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid transparent;
      color: var(--text-muted);
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.03);
    }

    .dimension-tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .dimension-tab-btn.active {
      background: #2563eb !important;
      color: #fff !important;
      border-color: #3b82f6 !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    /* Custom Table */
    .table-custom {
      --bs-table-bg: transparent;
      --bs-table-color: #e2e8f0;
      --bs-table-border-color: var(--surface-border);
    }

    .table-custom th {
      background-color: rgba(15, 23, 42, 0.6);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0.85rem 1rem;
    }

    .table-custom td {
      padding: 0.95rem 1rem;
      vertical-align: middle;
    }

    .table-row-hover:hover td {
      background-color: rgba(255, 255, 255, 0.03);
    }

    /* Fishbone SVG Canvas */
    .fishbone-wrapper {
      background: #0b0f19;
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 1.5rem;
      overflow-x: auto;
    }

    .fishbone-svg {
      width: 100%;
      min-width: 860px;
      height: 480px;
    }

    .fishbone-spine {
      stroke: #475569;
      stroke-width: 3;
    }

    /* Inputs styling */
    .form-control, .form-select {
      background-color: #0b0f19;
      border: 1px solid #334155;
      color: #f8fafc;
    }

    .form-control:focus, .form-select:focus {
      background-color: #0f172a;
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.2);
    }

    .form-control::placeholder {
      color: #64748b;
    }

    /* Modal Backdrop Dark */
    .modal-content {
      background-color: #1e293b;
      border: 1px solid var(--surface-border);
      color: #f8fafc;
    }

    .auth-banner {
      background: linear-gradient(90deg, rgba(0, 120, 212, 0.15), rgba(15, 23, 42, 0.6));
      border: 1px solid rgba(0, 120, 212, 0.4);
      border-radius: 12px;
      padding: 1rem 1.25rem;
    }

    @media print {
      body { background-color: #fff !important; color: #000 !important; }
      .navbar-custom, .no-print, button { display: none !important; }
      .surface-card, .kpi-card { background: #fff !important; border: 1px solid #ccc !important; color: #000 !important; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="d-flex justify-content-center align-items-center vh-100">
      <div class="text-center">
        <div class="spinner-border text-primary mb-3" role="status">
          <span class="visually-hidden">Loading 5M1E Production Tracker...</span>
        </div>
        <div class="text-muted small">Initializing 5M1E Production Quality Suite with Microsoft 365...</div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Inline Babel script: Works on both file:/// and http:// -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Official Microsoft 4-Color Logo SVG
    const MicrosoftLogo = ({ size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 21 21" style={{ flexShrink: 0 }}>
        <rect x="1" y="1" width="9" height="9" fill="#f25022" />
        <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
        <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
      </svg>
    );

    // Initial Baseline Production Records
    const INITIAL_RECORDS = [
      {
        id: "LOG-2026-001",
        timestamp: "2026-10-01 06:30",
        line: "LINE-01",
        shift: "SHIFT-A",
        workOrder: "WO-98442",
        partNumber: "PCB-MAIN-V4",
        eventType: "Change Point",
        severity: "Warning",
        primaryDimension: "Man",
        summary: "Operator rotation at SMT solder paste inspection station",
        recordedBy: "supervisor@plant.internal",
        m365Auth: true,
        man: {
          operator: "Alex Chen (EMP-4102)",
          skillLevel: "Tier 3",
          certified: true,
          notes: "First time operating Station #2 this week; supervisor shadowed for 30 mins."
        },
        machine: {
          stationId: "SMT-PRINT-01",
          status: "Running",
          temperature: 24.5,
          pressure: 0.52,
          rpm: 0,
          toolLife: 1420
        },
        material: {
          partNumber: "PASTE-SAC305",
          lotNumber: "LOT-20260928-A",
          supplier: "Alpha Solder Tech",
          coaVerified: true,
          notes: "Paste jar warmed to room temperature for 4 hrs before unsealing."
        },
        method: {
          sopNumber: "SOP-SMT-004 Rev 3",
          recipeId: "RECIPE_FINE_PITCH_02",
          stdCycleTime: 35,
          actCycleTime: 38,
          notes: "Squeegee speed adjusted from 45mm/s to 40mm/s for better aperture filling."
        },
        measurement: {
          toolId: "SPI-CYBEROPTICS-01",
          calibrationDue: "2026-12-15",
          feature: "Solder Height (um)",
          nominal: 130,
          lsl: 100,
          usl: 160,
          measured: 142,
          inSpec: true
        },
        environment: {
          temp: 23.2,
          humidity: 48,
          esdGrounding: "Pass",
          cleanroomClass: "ISO 7"
        }
      },
      {
        id: "LOG-2026-002",
        timestamp: "2026-10-01 07:15",
        line: "LINE-02",
        shift: "SHIFT-A",
        workOrder: "WO-98450",
        partNumber: "HOUSING-ALUM-88",
        eventType: "Abnormality",
        severity: "Critical",
        primaryDimension: "Machine",
        summary: "CNC spindle bearing temperature spike & chattering vibration",
        recordedBy: "maintenance-lead@plant.internal",
        m365Auth: true,
        man: {
          operator: "Sarah Connor (EMP-1088)",
          skillLevel: "Tier 4 (Master)",
          certified: true,
          notes: "Immediately engaged e-stop when acoustic chattering occurred."
        },
        machine: {
          stationId: "CNC-MILL-04",
          status: "Interlock Trip",
          temperature: 78.4,
          pressure: 6.8,
          rpm: 12000,
          toolLife: 8900
        },
        material: {
          partNumber: "BILLET-6061-T6",
          lotNumber: "LOT-AL-5502",
          supplier: "Kaiser Alloys",
          coaVerified: true,
          notes: "Hardness test in-spec (95 HB)."
        },
        method: {
          sopNumber: "SOP-CNC-ROUGH-01",
          recipeId: "PROG_O0881_CAM",
          stdCycleTime: 120,
          actCycleTime: 145,
          notes: "Feed rate overridden at 110% before trip occurred."
        },
        measurement: {
          toolId: "CMM-ZEISS-02",
          calibrationDue: "2026-11-01",
          feature: "Pocket Depth (mm)",
          nominal: 15.00,
          lsl: 14.95,
          usl: 15.05,
          measured: 15.18,
          inSpec: false
        },
        environment: {
          temp: 26.8,
          humidity: 55,
          esdGrounding: "N/A",
          cleanroomClass: "General Shop Floor"
        }
      }
    ];

    function App() {
      // -------------------------------------------------------------
      // Real Microsoft 365 Authentication State (Stored in localStorage)
      // -------------------------------------------------------------
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const savedUser = localStorage.getItem("m365_user_auth");
          return savedUser ? JSON.parse(savedUser) : null; // Starts strictly NULL until user actually signs in!
        } catch (e) {
          return null;
        }
      });

      // Azure AD MSAL Config state (Persisted in localStorage)
      const [azureConfig, setAzureConfig] = useState(() => {
        try {
          const cfg = localStorage.getItem("m365_azure_config");
          return cfg ? JSON.parse(cfg) : {
            clientId: "",
            tenantId: "common",
            redirectUri: window.location.origin
          };
        } catch (e) {
          return { clientId: "", tenantId: "common", redirectUri: window.location.origin };
        }
      });

      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showAzureSetup, setShowAzureSetup] = useState(false);
      const [isAuthenticating, setIsAuthenticating] = useState(false);
      const [authError, setAuthError] = useState("");
      const [authSuccessMsg, setAuthSuccessMsg] = useState("");

      // Save User Auth to localStorage
      useEffect(() => {
        try {
          if (currentUser) {
            localStorage.setItem("m365_user_auth", JSON.stringify(currentUser));
          } else {
            localStorage.removeItem("m365_user_auth");
          }
        } catch (e) {}
      }, [currentUser]);

      // Save Azure Config to localStorage
      useEffect(() => {
        try {
          localStorage.setItem("m365_azure_config", JSON.stringify(azureConfig));
        } catch (e) {}
      }, [azureConfig]);

      // Records State
      const [records, setRecords] = useState(() => {
        try {
          const saved = localStorage.getItem("5m1e_records");
          return saved ? JSON.parse(saved) : INITIAL_RECORDS;
        } catch (e) {
          return INITIAL_RECORDS;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem("5m1e_records", JSON.stringify(records));
        } catch (e) {}
      }, [records]);

      const [activeTab, setActiveTab] = useState("dashboard");
      const [selectedLine, setSelectedLine] = useState("ALL");
      const [selectedShift, setSelectedShift] = useState("ALL");
      const [selectedDimension, setSelectedDimension] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [activeFishboneRecord, setActiveFishboneRecord] = useState(null);

      const [formStep, setFormStep] = useState("man");
      const [formData, setFormData] = useState({
        line: "LINE-01",
        shift: "SHIFT-A",
        workOrder: "",
        partNumber: "",
        eventType: "Change Point",
        severity: "Warning",
        primaryDimension: "Man",
        summary: "",
        operator: "",
        skillLevel: "Tier 3",
        certified: true,
        manNotes: "",
        stationId: "",
        machineStatus: "Running",
        temperature: 24.0,
        pressure: 0.5,
        rpm: 0,
        toolLife: 0,
        materialPart: "",
        lotNumber: "",
        supplier: "",
        coaVerified: true,
        materialNotes: "",
        sopNumber: "",
        recipeId: "",
        stdCycleTime: 30,
        actCycleTime: 30,
        methodNotes: "",
        toolId: "",
        calibrationDue: "",
        feature: "",
        nominal: 10.0,
        lsl: 9.8,
        usl: 10.2,
        measured: 10.0,
        envTemp: 22.5,
        envHumidity: 50,
        esdGrounding: "Pass",
        cleanroomClass: "ISO 7"
      });

      // Automatically update operator in form when real M365 user logs in
      useEffect(() => {
        if (currentUser) {
          setFormData(prev => ({
            ...prev,
            operator: `${currentUser.name} (${currentUser.email})`
          }));
        }
      }, [currentUser]);

      useEffect(() => {
        if (!activeFishboneRecord && records.length > 0) {
          setActiveFishboneRecord(records[0]);
        }
      }, [records, activeFishboneRecord]);

      // -------------------------------------------------------------
      // Real Microsoft 365 OAuth 2.0 / MSAL Sign-In Flow
      // -------------------------------------------------------------
      const handleRealMicrosoftSignIn = async () => {
        setAuthError("");
        setAuthSuccessMsg("");

        if (!azureConfig.clientId || azureConfig.clientId.trim() === "") {
          setShowAzureSetup(true);
          setAuthError("Please enter your Microsoft Entra ID (Azure AD) Application Client ID below to connect your real M365 tenant.");
          return;
        }

        setIsAuthenticating(true);

        try {
          const msalConfig = {
            auth: {
              clientId: azureConfig.clientId.trim(),
              authority: `https://login.microsoftonline.com/${azureConfig.tenantId ? azureConfig.tenantId.trim() : "common"}`,
              redirectUri: window.location.origin
            },
            cache: {
              cacheLocation: "localStorage",
              storeAuthStateInCookie: true
            }
          };

          // Initialize MSAL PublicClientApplication
          const msalInstance = new msal.PublicClientApplication(msalConfig);
          if (msalInstance.initialize) {
            await msalInstance.initialize();
          }

          // Trigger Real Microsoft Login Popup (login.microsoftonline.com)
          const loginRequest = {
            scopes: ["User.Read", "openid", "profile", "email"],
            prompt: "select_account"
          };

          const response = await msalInstance.loginPopup(loginRequest);

          if (!response || !response.accessToken) {
            throw new Error("No access token returned from Microsoft 365.");
          }

          // Fetch Genuine User Profile from Microsoft Graph API
          let graphProfile = {};
          try {
            const graphRes = await fetch("https://graph.microsoft.com/v1.0/me", {
              headers: {
                Authorization: `Bearer ${response.accessToken}`
              }
            });
            if (graphRes.ok) {
              graphProfile = await graphRes.json();
            }
          } catch (gErr) {
            console.warn("Could not query Graph API /me directly:", gErr);
          }

          // Fetch Genuine Profile Photo if available
          let photoUrl = null;
          try {
            const photoRes = await fetch("https://graph.microsoft.com/v1.0/me/photo/$value", {
              headers: { Authorization: `Bearer ${response.accessToken}` }
            });
            if (photoRes.ok) {
              const photoBlob = await photoRes.blob();
              photoUrl = URL.createObjectURL(photoBlob);
            }
          } catch (pErr) {
            console.log("No profile photo uploaded in M365 account");
          }

          // Create Authenticated User Object
          const realName = graphProfile.displayName || response.account.name || response.account.username;
          const realEmail = graphProfile.mail || graphProfile.userPrincipalName || response.account.username;
          const initials = realName
            ? realName.split(" ").map(w => w[0]).join("").substring(0, 2).toUpperCase()
            : "M3";

          const authenticatedUser = {
            name: realName,
            email: realEmail,
            jobTitle: graphProfile.jobTitle || "Production Specialist",
            department: graphProfile.department || "Operations & Quality",
            officeLocation: graphProfile.officeLocation || "Facility Floor",
            tenantId: response.account.tenantId,
            homeAccountId: response.account.homeAccountId,
            avatar: initials,
            photoUrl: photoUrl,
            isAuthenticated: true,
            authMethod: "Microsoft 365 Entra ID (Real OAuth 2.0)",
            idToken: response.idToken,
            accessToken: response.accessToken,
            loginTimestamp: new Date().toISOString()
          };

          setCurrentUser(authenticatedUser);
          setAuthSuccessMsg(`Successfully authenticated as ${realName} (${realEmail})!`);
          setShowLoginModal(false);
        } catch (err) {
          console.error("Microsoft 365 Sign-In Error:", err);
          let friendlyError = err.message || "Failed to sign in with Microsoft.";
          if (friendlyError.includes("user_cancelled")) {
            friendlyError = "Sign-in cancelled by user.";
          } else if (friendlyError.includes("AADSTS700016") || friendlyError.includes("not found in the directory")) {
            friendlyError = "Application Client ID was not found in directory. Check your Azure Portal Client ID.";
          } else if (friendlyError.includes("redirect_uri")) {
            friendlyError = `Redirect URI mismatch. In Azure Portal, set SPA redirect URI to: ${window.location.origin}`;
          }
          setAuthError(friendlyError);
        } finally {
          setIsAuthenticating(false);
        }
      };

      const handleLogout = () => {
        if (window.confirm("Are you sure you want to sign out of Microsoft 365?")) {
          setCurrentUser(null);
          localStorage.removeItem("m365_user_auth");
          setAuthSuccessMsg("");
          setAuthError("");
        }
      };

      // -------------------------------------------------------------
      // Form Input Handling
      // -------------------------------------------------------------
      const handleInputChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === "checkbox" ? checked : value
        }));
      };

      const handleSaveRecord = (e) => {
        e.preventDefault();

        // Enforce Authentication to record new production events
        if (!currentUser) {
          setShowLoginModal(true);
          setAuthError("You must sign in with Microsoft 365 to submit production change points or abnormalities.");
          return;
        }

        if (!formData.workOrder || !formData.summary) {
          alert("Please fill in the Work Order and Event Summary.");
          return;
        }

        const measuredVal = parseFloat(formData.measured) || 0;
        const uslVal = parseFloat(formData.usl) || 0;
        const lslVal = parseFloat(formData.lsl) || 0;
        const inSpec = measuredVal >= lslVal && measuredVal <= uslVal;

        const newRecord = {
          id: `LOG-${new Date().getFullYear()}-${String(records.length + 1).padStart(3, "0")}`,
          timestamp: new Date().toISOString().replace("T", " ").substring(0, 16),
          line: formData.line,
          shift: formData.shift,
          workOrder: formData.workOrder,
          partNumber: formData.partNumber || "N/A",
          eventType: formData.eventType,
          severity: formData.severity,
          primaryDimension: formData.primaryDimension,
          summary: formData.summary,
          recordedBy: currentUser.email,
          recordedByName: currentUser.name,
          m365Auth: true,
          man: {
            operator: formData.operator || currentUser.name,
            skillLevel: formData.skillLevel,
            certified: formData.certified,
            notes: formData.manNotes
          },
          machine: {
            stationId: formData.stationId || "STATION-GEN",
            status: formData.machineStatus,
            temperature: parseFloat(formData.temperature) || 0,
            pressure: parseFloat(formData.pressure) || 0,
            rpm: parseFloat(formData.rpm) || 0,
            toolLife: parseInt(formData.toolLife) || 0
          },
          material: {

                        <span className="badge bg-success">100% Verified</span>
                      </div>
                      <div className="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between align-items-center">
                        <div>
                          <strong className="text-warning">2. Machine (Predictive Health)</strong>
                          <div className="small text-muted">Vibration chattering on CNC-MILL-04 flagged</div>
                        </div>
                        <span className="badge bg-danger">1 Alert</span>
                      </div>
                      <div className="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between align-items-center">
                        <div>
                          <strong className="text-success">3. Material (Traceability)</strong>
                          <div className="small text-muted">100% of lots linked to vendor Certificate of Analysis</div>
                        </div>
                        <span className="badge bg-success">100% CoA</span>
                      </div>
                      <div className="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between align-items-center">
                        <div>
                          <strong style={{ color: '#a78bfa' }}>4. Method (Standard Work)</strong>
                          <div className="small text-muted">Cycle time within +/- 10% of standard work definition</div>
                        </div>
                        <span className="badge bg-success">Nominal</span>
                      </div>
                      <div className="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between align-items-center">
                        <div>
                          <strong className="text-danger">5. Measurement (Calibration & Gage R&R)</strong>
                          <div className="small text-muted">All active micrometers and SPI sensors calibrated</div>
                        </div>
                        <span className="badge bg-success">Valid</span>
                      </div>
                      <div className="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between align-items-center">
                        <div>
                          <strong style={{ color: '#2dd4bf' }}>6. Environment (ESD & Cleanliness)</strong>
                          <div className="small text-muted">Humidity dipped to 32% in Cleanroom 2 (Warning)</div>
                        </div>
                        <span className="badge bg-warning text-dark">Warning</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>

          {/* -------------------------------------------------------------
              MODAL: REAL MICROSOFT 365 SIGN IN & ENTRA ID CONFIG
          ------------------------------------------------------------- */}
          {showLoginModal && (
            <div className="modal show d-block" tabIndex="-1" style={{ backgroundColor: 'rgba(0,0,0,0.8)' }}>
              <div className="modal-dialog modal-dialog-centered">
                <div className="modal-content shadow-lg">
                  <div className="modal-header border-secondary">
                    <div className="d-flex align-items-center gap-2">
                      <MicrosoftLogo size={20} />
                      <h5 className="modal-title fw-bold text-white">Sign In with Microsoft 365</h5>
                    </div>
                    <button type="button" className="btn-close btn-close-white" onClick={() => setShowLoginModal(false)}></button>
                  </div>
                  <div className="modal-body p-4">
                    <p className="text-muted small mb-3">
                      Authenticate directly using your corporate <strong>Microsoft 365</strong> or <strong>Entra ID (Azure AD)</strong> account to verify your identity and stamp your electronic signature on all 5M1E change points.
                    </p>

                    {authError && (
                      <div className="alert alert-danger py-2 small mb-3 d-flex align-items-start gap-2">
                        <i className="bi bi-exclamation-octagon-fill fs-6 mt-1"></i>
                        <div>{authError}</div>
                      </div>
                    )}

                    {authSuccessMsg && (
                      <div className="alert alert-success py-2 small mb-3">
                        <i className="bi bi-check-circle-fill me-1"></i> {authSuccessMsg}
                      </div>
                    )}

                    {/* Microsoft 365 Real Sign-In Button */}
                    <div className="text-center my-3">
                      <button 
                        className="btn btn-m365 w-100 py-2 justify-content-center fs-6"
                        onClick={handleRealMicrosoftSignIn}
                        disabled={isAuthenticating}
                      >
                        {isAuthenticating ? (
                          <>
                            <span className="spinner-border spinner-border-sm me-2" role="status"></span>
                            Connecting to Microsoft 365...
                          </>
                        ) : (
                          <>
                            <MicrosoftLogo size={20} />
                            <span>Sign in with Microsoft</span>
                          </>
                        )}
                      </button>
                    </div>

                    {/* Azure Entra ID App Credentials Config Form */}
                    <div className="mt-4 p-3 rounded border border-secondary" style={{ background: '#0b0f19' }}>
                      <div className="d-flex justify-content-between align-items-center mb-2">
                        <span className="small fw-bold text-white">
                          <i className="bi bi-key me-1 text-warning"></i> Microsoft Entra ID (Azure AD) Client ID
                        </span>
                        <button 
                          type="button" 
                          className="btn btn-link btn-sm p-0 text-info"
                          style={{ fontSize: '0.75rem' }}
                          onClick={() => setShowAzureSetup(!showAzureSetup)}
                        >
                          {showAzureSetup ? "Hide Guide" : "Setup Guide & Info"}
                        </button>
                      </div>

                      <div className="mb-2">
                        <label className="form-label small text-muted mb-1">Application (client) ID:</label>
                        <input 
                          type="text" 
                          className="form-control form-control-sm font-mono" 
                          placeholder="e.g. 00000000-0000-0000-0000-000000000000" 
                          value={azureConfig.clientId}
                          onChange={(e) => setAzureConfig({ ...azureConfig, clientId: e.target.value.trim() })}
                        />
                      </div>

                      <div className="mb-2">
                        <label className="form-label small text-muted mb-1">Directory (tenant) ID or 'common':</label>
                        <input 
                          type="text" 
                          className="form-control form-control-sm font-mono" 
                          placeholder="common (supports any organization or personal account)" 
                          value={azureConfig.tenantId}
                          onChange={(e) => setAzureConfig({ ...azureConfig, tenantId: e.target.value.trim() })}
                        />
                      </div>

                      <div className="text-muted" style={{ fontSize: '0.72rem' }}>
                        Redirect URI registered in Azure: <code className="text-info">{window.location.origin}</code>
                      </div>

                      {showAzureSetup && (
                        <div className="mt-3 pt-2 border-top border-secondary text-muted small" style={{ fontSize: '0.75rem', lineHeight: '1.4' }}>
                          <strong className="text-white d-block mb-1">How to get your Azure Client ID:</strong>
                          <ol className="ps-3 mb-0">
                            <li>Sign in to <a href="https://portal.azure.com/#blade/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/RegisteredApps" target="_blank" rel="noreferrer" className="text-info">Azure Portal (App registrations)</a>.</li>
                            <li>Click <strong>New registration</strong>, name it <em>5M1E Production Tracker</em>.</li>
                            <li>Select <strong>Single-page application (SPA)</strong> and set redirect URI to <code>{window.location.origin}</code>.</li>
                            <li>Copy the <strong>Application (client) ID</strong> and paste it above!</li>
                          </ol>
                        </div>
                      )}
                    </div>

                    <div className="mt-3 text-center">
                      <button 
                        className="btn btn-link btn-sm text-secondary text-decoration-none"
                        onClick={() => setShowLoginModal(false)}
                      >
                        Continue browsing in Read-Only mode
                      </button>
                    </div>

                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function RadarChartComponent({ records }) {
      const canvasRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        const counts = {
          Man: 0,
          Machine: 0,
          Material: 0,
          Method: 0,
          Measurement: 0,
          Environment: 0
        };

        records.forEach(r => {
          const dim = r.primaryDimension;
          if (counts[dim] !== undefined) counts[dim]++;
        });

        const ctx = canvasRef.current.getContext('2d');
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        chartInstance.current = new Chart(ctx, {
          type: 'radar',
          data: {
            labels: ['Man', 'Machine', 'Material', 'Method', 'Measurement', 'Environment'],
            datasets: [{
              label: 'Events & Change Points Recorded',
              data: [
                counts.Man,
                counts.Machine,
                counts.Material,
                counts.Method,
                counts.Measurement,
                counts.Environment
              ],
              backgroundColor: 'rgba(56, 189, 248, 0.25)',
              borderColor: '#38bdf8',
              borderWidth: 2,
              pointBackgroundColor: '#38bdf8',
              pointBorderColor: '#fff',
              pointHoverBackgroundColor: '#fff',
              pointHoverBorderColor: '#38bdf8'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              r: {
                angleLines: { color: '#334155' },
                grid: { color: '#1e293b' },
                pointLabels: {
                  color: '#f8fafc',
                  font: { size: 12, weight: 'bold' }
                },
                ticks: {
                  color: '#94a3b8',
                  backdropColor: 'transparent',
                  stepSize: 1
                }
              }
            },
            plugins: {
              legend: {
                labels: { color: '#f8fafc' }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, [records]);

      return (
        <div style={{ height: '340px', position: 'relative' }}>
          <canvas ref={canvasRef}></canvas>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
