{% extends "base.html" %}

{% block title %}Log In - Web PPT Clone{% endblock %}
{% block body_class %}auth-body{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <span class="logo-icon">📊</span>
        <span class="logo-text">SlideCraft</span>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Log in to create and present your slides</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          value="{{ username or '' }}" 
          required 
          autofocus 
          placeholder="Enter your username"
          class="form-control"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          placeholder="••••••••"
          class="form-control"
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
