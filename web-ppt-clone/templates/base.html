<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SlideCraft{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background-color: #f3f2f1; color: #323130; }
        .flash-messages { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .alert { padding: 12px 20px; margin-bottom: 10px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .alert-success { background-color: #dff6dd; color: #107c10; border-left: 4px solid #107c10; }
        .alert-danger { background-color: #fde7e9; color: #a4262c; border-left: 4px solid #a4262c; }
        .alert-info { background-color: #e7f4f9; color: #0078d4; border-left: 4px solid #0078d4; }
        .alert-warning { background-color: #fff4ce; color: #797775; border-left: 4px solid #fce100; }
        * { box-sizing: border-box; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    {% block content %}{% endblock %}

    <script>
        setTimeout(() => {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                alert.style.transition = 'opacity 0.5s ease';
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 500);
            });
        }, 3000);
    </script>
</body>
</html>
